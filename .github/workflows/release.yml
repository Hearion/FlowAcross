name: 发布新版本

# 推送 v* 标签时运行：校验版本号 → 打包 Windows、macOS 和 Linux → 发布到公开的发布仓库。
# 发布前把安装包和更新文件复制一份到阿里云 OSS（scripts/mirror-to-oss.mjs），国内下载和应用内更新走 OSS；
# 已安装的流界先读 OSS 上的 latest.json，读不到再读发布仓库的。Linux 的三种安装包（AppImage、deb、Arch 包）
# 在打包后单独签名，由发布任务写进 latest.json（scripts/add-linux-updates.mjs）。
# 一次性配置和发版步骤见 docs/release.md。
#
# 版本号带后缀的标签（如 v0.2.2-beta.1）是测试版：发布成 Pre-release，不会成为 latest，
# 已安装的流界收不到更新提示；构建用快一些的优化配置。
on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # 安装包和 latest.json 仍发布到独立公开仓库，保持现有客户端的更新地址可用；源码仓库已公开。
  RELEASE_OWNER: ${{ github.repository_owner }}
  RELEASE_REPO: FlowAcross-releases

jobs:
  prepare:
    name: 校验版本并创建草稿
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.release.outputs.id }}
      notes: ${{ steps.notes.outputs.notes }}
      # 版本号带后缀（-beta.1、-rc.1 …）就是测试版。
      prerelease: ${{ contains(github.ref_name, '-') }}
    steps:
      - uses: actions/checkout@v5

      - name: 检查密钥配置
        env:
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          OSS_REGION: ${{ secrets.OSS_REGION }}
          OSS_BUCKET: ${{ secrets.OSS_BUCKET }}
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          DOWNLOAD_BASE_URL: ${{ secrets.DOWNLOAD_BASE_URL }}
        run: |
          missing=0
          if [ -z "$RELEASES_TOKEN" ]; then
            echo "::error::缺少 RELEASES_TOKEN：需要一个能写入 $RELEASE_OWNER/$RELEASE_REPO 的令牌，配置方法见 docs/release.md。"
            missing=1
          fi
          if [ -z "$SIGNING_KEY" ]; then
            echo "::error::缺少 TAURI_SIGNING_PRIVATE_KEY：没有它无法给更新包签名，配置方法见 docs/release.md。"
            missing=1
          fi
          # 打包要二十分钟，缺 OSS 配置的话在开头就报出来，免得打完包才在复制到阿里云那一步失败。
          for name in OSS_REGION OSS_BUCKET OSS_ACCESS_KEY_ID OSS_ACCESS_KEY_SECRET DOWNLOAD_BASE_URL; do
            if [ -z "${!name}" ]; then
              echo "::error::缺少 $name：发布前要把安装包复制到阿里云 OSS，配置方法见 docs/release.md 的「阿里云 OSS」。"
              missing=1
            fi
          done
          exit $missing

      - name: 校验版本号
        run: |
          tag="${GITHUB_REF_NAME#v}"
          cargo=$(sed -n '/^\[workspace.package\]/,/^\[/{s/^version = "\(.*\)"/\1/p}' Cargo.toml)
          tauri=$(jq -r .version app/src-tauri/tauri.conf.json)
          npm=$(jq -r .version app/package.json)
          echo "标签 $tag / Cargo.toml $cargo / tauri.conf.json $tauri / package.json $npm"
          if [ "$tag" != "$cargo" ] || [ "$tag" != "$tauri" ] || [ "$tag" != "$npm" ]; then
            echo "::error::标签和版本号不一致。先运行 node scripts/bump-version.mjs $tag，提交后重新打标签。"
            exit 1
          fi

      - name: 读取更新说明
        id: notes
        run: |
          git fetch --force origin "+refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          notes=$(git tag -l --format='%(contents)' "$GITHUB_REF_NAME" | sed '/-----BEGIN/,$d')
          [ -z "$notes" ] && notes="流界 $GITHUB_REF_NAME"
          source_url="https://github.com/$GITHUB_REPOSITORY/tree/$GITHUB_SHA"
          license_url="https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_SHA/LICENSE"
          policy_url="https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_SHA/docs/code-signing-policy.md"
          privacy_url="https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_SHA/PRIVACY.md"
          notes="$(printf '%s\n\n## License and source\n\nGPL-3.0-only · [License](%s) · [Source and build instructions](%s)\n\n## Code signing policy\n\n[Code signing policy and team roles](%s) · [Privacy policy](%s)\n\nSignPath Foundation signing is not yet approved or active. Check the downloaded file’s actual digital signature.\n' "$notes" "$license_url" "$source_url" "$policy_url" "$privacy_url")"
          {
            echo "notes<<EOF_NOTES"
            echo "$notes"
            echo "EOF_NOTES"
          } >> "$GITHUB_OUTPUT"

      - name: 创建草稿发布
        id: release
        uses: actions/github-script@v8
        env:
          NOTES: ${{ steps.notes.outputs.notes }}
          PRERELEASE: ${{ contains(github.ref_name, '-') }}
        with:
          github-token: ${{ secrets.RELEASES_TOKEN }}
          script: |
            const owner = process.env.RELEASE_OWNER;
            const repo = process.env.RELEASE_REPO;
            const tag = context.ref.replace('refs/tags/', '');
            const prerelease = process.env.PRERELEASE === 'true';
            const { data: info } = await github.rest.repos.get({ owner, repo });
            // 重新运行时复用同一个草稿。
            const releases = await github.paginate(github.rest.repos.listReleases, { owner, repo });
            const existing = releases.find((r) => r.tag_name === tag);
            if (existing && !existing.draft) {
              core.setFailed(`${owner}/${repo} 已经发布过 ${tag}。请改用新的版本号。`);
              return;
            }
            const release = existing ?? (await github.rest.repos.createRelease({
              owner,
              repo,
              tag_name: tag,
              name: prerelease ? `流界 ${tag}（测试版）` : `流界 ${tag}`,
              body: process.env.NOTES,
              draft: true,
              // 草稿一开始就标成测试版，任何时候都不会被当成 latest。
              prerelease,
              target_commitish: info.default_branch,
            })).data;
            core.setOutput('id', release.id);

  build:
    name: 打包 ${{ matrix.name }}
    needs: prepare
    strategy:
      # 一个平台失败时另一个继续打完，方便一次看到所有问题（缺平台时 publish 不会发布）。
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            args: --bundles nsis
          - name: macOS
            # Intel 构建机同样生成通用包，避免 ARM 托管构建机容量不足阻塞发版。
            os: macos-15-intel
            args: --target universal-apple-darwin --bundles app,dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2

      # 测试版用快一些的优化配置，正式版不设，按 Cargo.toml 里的来（全量 LTO、单个代码生成单元）。
      # 发布构建三分之二的时间花在最后一步"整体优化"上（日志停在最后一个依赖 gethostname 那一行，其实是在编主程序）。
      # 轻量 LTO 加多个代码生成单元能并行做这一步：本机实测总耗时减半，二进制大约 3.6 MB。
      # 只能在测试版时才写入这两个变量：值为空的话 Cargo 不会忽略，会直接报错。
      - name: 测试版用快速构建配置
        if: needs.prepare.outputs.prerelease == 'true'
        shell: bash
        run: |
          echo "CARGO_PROFILE_RELEASE_LTO=thin" >> "$GITHUB_ENV"
          echo "CARGO_PROFILE_RELEASE_CODEGEN_UNITS=16" >> "$GITHUB_ENV"

      - name: 安装前端依赖
        working-directory: app
        run: npm ci

      # 只在发布时生成更新包（需要签名私钥），本地打包不受影响。
      - name: 开启更新包
        shell: bash
        run: |
          node -e '
            const fs = require("fs");
            const f = "app/src-tauri/tauri.conf.json";
            const c = JSON.parse(fs.readFileSync(f, "utf8"));
            c.bundle.createUpdaterArtifacts = true;
            fs.writeFileSync(f, JSON.stringify(c, null, 2) + "\n");
          '

      # macOS 按签名记住「辅助功能」「输入监控」授权。用固定证书签名，用户更新后不用重新授权。
      - name: 准备 macOS 签名证书
        if: runner.os == 'macOS'
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          if [ -z "$CERT" ]; then
            echo "::warning::没有配置 APPLE_CERTIFICATE，macOS 包使用 ad-hoc 签名：用户每次更新后都要重新授权辅助功能和输入监控。配置方法见 docs/release.md。"
            exit 0
          fi
          IDENTITY="${IDENTITY:-FlowAcross Dev}"
          work="$RUNNER_TEMP/cert-check"
          mkdir -p "$work"
          trap 'rm -rf "$work"' EXIT

          # 去掉粘贴时混进来的换行和空格。
          clean=$(printf '%s' "$CERT" | tr -d ' \t\r\n')
          echo "::add-mask::$clean"
          if ! printf '%s' "$clean" | base64 --decode > "$work/cert.p12" 2>/dev/null || [ ! -s "$work/cert.p12" ]; then
            echo "::error::APPLE_CERTIFICATE 不是有效的 base64。在 Mac 上运行 base64 -i FlowAcross-Dev.p12 | pbcopy，把剪贴板内容重新粘贴到这个 Secret。"
            exit 1
          fi
          echo "证书文件 $(wc -c < "$work/cert.p12" | tr -d ' ') 字节：$(file -b "$work/cert.p12")"

          # 自签名证书不受系统信任，Tauri 自己导入证书时会找不到签名身份（failed to resolve signing identity）。
          # 所以和本机 build-mac.sh 一样：证书放进钥匙串，只把证书名称交给 Tauri，由 codesign 直接签名。
          keychain="$RUNNER_TEMP/signing.keychain-db"
          kc_pass=$(openssl rand -hex 16)
          security create-keychain -p "$kc_pass" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$kc_pass" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          if ! security import "$work/cert.p12" -k "$keychain" -f pkcs12 -P "$CERT_PASSWORD" -T /usr/bin/codesign > "$work/import.log" 2>&1; then
            cat "$work/import.log"
            if grep -qi "MAC verification\|passphrase\|password" "$work/import.log"; then
              echo "::error::APPLE_CERTIFICATE_PASSWORD 和导出 .p12 时设置的密码不一致。"
            else
              echo "::error::APPLE_CERTIFICATE 解码后不是有效的 .p12 证书。请在「钥匙串访问 → 我的证书」里右键「$IDENTITY」导出为 .p12（要带私钥），再用 base64 -i 文件名 | pbcopy 复制。"
            fi
            exit 1
          fi
          # 允许 codesign 在无界面的 CI 上使用私钥，不弹授权窗口。
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kc_pass" "$keychain" > /dev/null
          if ! security find-certificate -c "$IDENTITY" "$keychain" > /dev/null 2>&1; then
            echo "::error::证书里找不到名为「$IDENTITY」的签名身份。确认导出的是这张证书，或用 APPLE_SIGNING_IDENTITY 填写证书名称。"
            exit 1
          fi

          # 先签一个测试文件，确认证书能用，免得编译十分钟后才失败。
          cp /bin/ls "$work/sign-test"
          if ! codesign --force --sign "$IDENTITY" "$work/sign-test" > "$work/sign.log" 2>&1; then
            cat "$work/sign.log"
            echo "::error::证书已导入，但无法用「$IDENTITY」签名。确认导出的 .p12 带有私钥。"
            exit 1
          fi

          echo "APPLE_SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "证书检查通过，将使用该证书签名。"

      - name: 打包并上传
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          owner: ${{ env.RELEASE_OWNER }}
          repo: ${{ env.RELEASE_REPO }}
          releaseId: ${{ needs.prepare.outputs.release_id }}
          releaseBody: ${{ needs.prepare.outputs.notes }}
          prerelease: ${{ needs.prepare.outputs.prerelease }}
          includeUpdaterJson: true
          args: ${{ matrix.args }}

  # Linux 安装包（deb、AppImage、Arch 包）。这里不写 latest.json（和另外两个打包任务同时改会互相覆盖），
  # 只给三个安装包签名并把签名传上去；发布任务再把它们写进 latest.json。
  build-linux:
    name: 打包 Linux
    needs: prepare
    # 用较老的系统打包，装得上的发行版更多（glibc 向后兼容，不向前兼容）。
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev \
            libxkbcommon-dev patchelf file

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # 测试版用快一些的优化配置，正式版不设，按 Cargo.toml 里的来（全量 LTO、单个代码生成单元）。
      # 发布构建三分之二的时间花在最后一步"整体优化"上（日志停在最后一个依赖 gethostname 那一行，其实是在编主程序）。
      # 轻量 LTO 加多个代码生成单元能并行做这一步：本机实测总耗时减半，二进制大约 3.6 MB。
      # 只能在测试版时才写入这两个变量：值为空的话 Cargo 不会忽略，会直接报错。
      - name: 测试版用快速构建配置
        if: needs.prepare.outputs.prerelease == 'true'
        shell: bash
        run: |
          echo "CARGO_PROFILE_RELEASE_LTO=thin" >> "$GITHUB_ENV"
          echo "CARGO_PROFILE_RELEASE_CODEGEN_UNITS=16" >> "$GITHUB_ENV"

      - name: 安装前端依赖
        working-directory: app
        run: npm ci

      # 不让 tauri-action 写 latest.json：它会写成 linux-x86_64 / linux-x86_64-deb，旧版本的流界
      # 在 Arch 上会照着去装 deb（见 scripts/add-linux-updates.mjs 开头的说明）。
      - name: 打包并上传
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        with:
          projectPath: app
          owner: ${{ env.RELEASE_OWNER }}
          repo: ${{ env.RELEASE_REPO }}
          releaseId: ${{ needs.prepare.outputs.release_id }}
          releaseBody: ${{ needs.prepare.outputs.notes }}
          prerelease: ${{ needs.prepare.outputs.prerelease }}
          includeUpdaterJson: false
          args: --bundles deb,appimage

      # Arch 系（Arch、CachyOS、Manjaro）用的安装包：把上一步的 .deb 重新打包，不重新编译。
      - name: 打 Arch 安装包
        run: scripts/build-arch-pkg.sh target/release/bundle/deb/*.deb "$GITHUB_REF_NAME" arch-package

      # 应用内更新下载安装包后要验签名。三个安装包都用更新私钥签一遍，签名文件放到同一个目录里一起上传。
      - name: 给 Linux 安装包签名
        working-directory: app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(../target/release/bundle/deb/*.deb ../target/release/bundle/appimage/*.AppImage ../arch-package/*.pkg.tar.zst)
          if [ "${#files[@]}" -ne 3 ]; then
            echo "::error::应当正好有 3 个 Linux 安装包（deb、AppImage、Arch 包），实际找到 ${#files[@]} 个：${files[*]:-无}"
            exit 1
          fi
          for f in "${files[@]}"; do
            # 私钥从环境变量读；密码显式传入，没有密码时是空字符串，不会停下来等人输入。
            npx tauri signer sign --password "${TAURI_SIGNING_PRIVATE_KEY_PASSWORD:-}" "$f" > /dev/null
            if [ ! -s "$f.sig" ]; then
              echo "::error::没有生成 $(basename "$f") 的签名文件。"
              exit 1
            fi
            # Arch 包的签名本来就生成在 arch-package 里，不用复制（把文件复制到它自己会报错）。
            case "$f" in
              ../arch-package/*) ;;
              *) cp "$f.sig" ../arch-package/ ;;
            esac
            echo "已签名 $(basename "$f")"
          done

      - name: 上传 Arch 安装包和三个签名
        uses: actions/github-script@v8
        env:
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
        with:
          github-token: ${{ secrets.RELEASES_TOKEN }}
          script: |
            const fs = require('fs');
            const path = require('path');
            const owner = process.env.RELEASE_OWNER;
            const repo = process.env.RELEASE_REPO;
            const release_id = Number(process.env.RELEASE_ID);
            const dir = 'arch-package';
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, { owner, repo, release_id });
            for (const name of fs.readdirSync(dir).filter((n) => n.endsWith('.pkg.tar.zst') || n.endsWith('.sig'))) {
              // 重新运行时先删掉上次传的同名文件。
              const old = assets.find((a) => a.name === name);
              if (old) await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: old.id });
              const data = fs.readFileSync(path.join(dir, name));
              await github.rest.repos.uploadReleaseAsset({
                owner, repo, release_id, name, data,
                headers: { 'content-type': name.endsWith('.sig') ? 'text/plain' : 'application/zstd', 'content-length': data.length },
              });
              core.info(`已上传 ${name}（${(data.length / 1048576).toFixed(1)} MB）`);
            }

  publish:
    name: 检查、复制到阿里云并正式发布
    # 三个系统的包都打完才发布。
    needs: [prepare, build, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # 三个打包任务都结束了，latest.json 不会再被别人改：把 Linux 的三种安装包写进去。
      - name: 把 Linux 安装包写进更新清单
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          RELEASE_REPO: ${{ env.RELEASE_OWNER }}/${{ env.RELEASE_REPO }}
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
        run: node scripts/add-linux-updates.mjs

      - name: 检查草稿
        uses: actions/github-script@v8
        env:
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        with:
          github-token: ${{ secrets.RELEASES_TOKEN }}
          script: |
            const owner = process.env.RELEASE_OWNER;
            const repo = process.env.RELEASE_REPO;
            const release_id = Number(process.env.RELEASE_ID);
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, { owner, repo, release_id });
            const asset = assets.find((a) => a.name === 'latest.json');
            if (!asset) {
              core.setFailed('草稿里没有 latest.json，已安装的流界收不到这次更新。请检查打包日志。');
              return;
            }
            const { data } = await github.request('GET /repos/{owner}/{repo}/releases/assets/{asset_id}', {
              owner, repo, asset_id: asset.id, headers: { accept: 'application/octet-stream' },
            });
            const latest = JSON.parse(Buffer.from(data).toString('utf8'));
            const platforms = Object.keys(latest.platforms ?? {});
            core.info(`latest.json：版本 ${latest.version}，平台 ${platforms.join(', ')}`);
            // 两个打包任务同时写 latest.json 时可能互相覆盖，缺平台就不发布，重新运行失败的任务即可。
            const required = [
              'windows-x86_64', 'darwin-aarch64', 'darwin-x86_64',
              'linux-x86_64-appimage', 'linux-x86_64-dpkg', 'linux-x86_64-pacman',
            ];
            const missing = required.filter((p) => !platforms.includes(p));
            if (missing.length) {
              core.setFailed(`latest.json 缺少 ${missing.join(', ')}，草稿未发布。在 Actions 页面重新运行全部任务即可。`);
              return;
            }
            // 这两项会让 0.2.3 及更早、装在 Arch 上的流界去装 deb（见 scripts/add-linux-updates.mjs）。
            const unsafe = ['linux-x86_64', 'linux-x86_64-deb'].filter((p) => platforms.includes(p));
            if (unsafe.length) {
              core.setFailed(`latest.json 里不应该有 ${unsafe.join(', ')}，草稿未发布。`);
              return;
            }
            // Linux 安装包也要齐。
            const names = assets.map((a) => a.name);
            const lacking = ['.deb', '.AppImage', '.pkg.tar.zst'].filter((ext) => !names.some((n) => n.endsWith(ext)));
            if (lacking.length) {
              core.setFailed(`草稿里缺少 Linux 安装包（${lacking.join('、')}），草稿未发布。请检查「打包 Linux」的日志。`);
              return;
            }

      # 先复制到 OSS 再发布：OSS 传失败时 GitHub 上也不发布，两边的最新版本保持一致
      # （已安装的流界先读 OSS 的清单，OSS 落后的话它们就收不到这次更新）。
      - name: 安装 OSS SDK
        run: npm install --no-save --no-audit --no-fund --prefix "$RUNNER_TEMP/oss-sdk" ali-oss@6.23.0

      - name: 复制到阿里云 OSS
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          RELEASE_REPO: ${{ env.RELEASE_OWNER }}/${{ env.RELEASE_REPO }}
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
          OSS_REGION: ${{ secrets.OSS_REGION }}
          OSS_BUCKET: ${{ secrets.OSS_BUCKET }}
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          DOWNLOAD_BASE_URL: ${{ secrets.DOWNLOAD_BASE_URL }}
          # 存储桶 bapihou-app-release 里还放别的软件，流界的文件都在这个目录下。
          OSS_PREFIX: FlowAcross
          OSS_SDK_DIR: ${{ runner.temp }}/oss-sdk
        run: node scripts/mirror-to-oss.mjs

      - name: 正式发布
        uses: actions/github-script@v8
        env:
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        with:
          github-token: ${{ secrets.RELEASES_TOKEN }}
          script: |
            const owner = process.env.RELEASE_OWNER;
            const repo = process.env.RELEASE_REPO;
            const release_id = Number(process.env.RELEASE_ID);
            const { data: release } = await github.rest.repos.getRelease({ owner, repo, release_id });
            const latest = { version: release.tag_name.replace(/^v/, '') };
            if (process.env.PRERELEASE === 'true') {
              // 测试版：不成为 latest，releases/latest/download/latest.json 仍指向上一个正式版。
              const { data: published } = await github.rest.repos.updateRelease({
                owner, repo, release_id, draft: false, prerelease: true, make_latest: 'false',
              });
              core.notice(`已发布测试版 ${latest.version}：${published.html_url}`);
              return;
            }
            await github.rest.repos.updateRelease({ owner, repo, release_id, draft: false, make_latest: 'true' });
            core.notice(`已发布 ${latest.version}：https://github.com/${owner}/${repo}/releases/latest`);
