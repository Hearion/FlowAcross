[workspace]
resolver = "2"
members = ["crates/flow-core", "crates/flow-platform", "crates/flow-net", "app/src-tauri"]

[workspace.package]
version = "0.1.4"
edition = "2024"
rust-version = "1.85"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
flow-core = { path = "crates/flow-core" }
flow-platform = { path = "crates/flow-platform" }
flow-net = { path = "crates/flow-net" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1", default-features = false, features = ["use-std"] }
sha2 = "0.10"
thiserror = "2"

[profile.release]
lto = true
codegen-units = 1
strip = true
